name: bench-results
# Trust model: the bench page lets anyone with a GitHub account open an issue, and any of those fields (title,
# body, labels, the submitting user) are attacker-controlled input to this workflow. Ingesting a result — writing
# into bench/devices/*.json and committing to main — is a privileged action, so it happens only after a repo
# collaborator with `write` or `admin` permission applies the `bench-accepted` label (checked live against the
# GitHub API for the user who applied it, not merely "a label with this name exists"). Editing an already-accepted
# issue withdraws that acceptance, so a maintainer never reviews one body and has another get committed later.
#
# No job here trusts issue text in a shell command: the issue body reaches `bench-ingest.mjs` only via an `env`
# var, and every other `${{ }}` expression used inside a `run:` block below is likewise passed through `env` and
# referenced as a shell variable ($VAR), never interpolated directly into the script text. Neither the ingest
# script's exit status nor its message is written through `$GITHUB_OUTPUT`: status is read from the built-in
# `steps.<id>.outcome` (set by `continue-on-error`, not by us), and the message — which can contain attacker text
# echoed back from validation errors — stays in a file under `$RUNNER_TEMP` that later steps `cat` directly.
on:
  issues:
    types: [labeled, edited]
permissions: {}
jobs:
  # An edit to an OPEN issue that currently carries `bench-accepted` means the content a maintainer approved may
  # no longer be what's there. Pull the label and say why; a maintainer has to look again and re-apply it. (A
  # closed issue is skipped: its result is already ingested, so re-applying the label on it would do nothing —
  # `ingest` itself requires `issue.state == 'open'` — and telling someone to re-apply a label that can't do
  # anything would be misleading.) Removing a label emits `unlabeled`, which this workflow does not subscribe to,
  # and commenting emits no issue event at all — neither step here can retrigger this workflow, so there's no loop.
  revoke:
    name: Revoke acceptance on edit
    if: github.event.action == 'edited' && github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'bench-accepted')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Remove bench-accepted and explain why
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -e
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label bench-accepted
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body \
            "Editing this issue withdrew its \`bench-accepted\` acceptance. A maintainer needs to review the new content and re-apply the \`bench-accepted\` label before it is ingested."

  # Runs only for the specific label event that grants acceptance, on an issue that's still open.
  ingest:
    name: Ingest an accepted result
    if: github.event.action == 'labeled' && github.event.label.name == 'bench-accepted' && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      actions: write
    # One concurrency slot per issue: two labelings of the *same* issue never race each other, but different
    # issues' results still ingest in parallel. `cancel-in-progress: false` so a run already partway through a
    # commit is never cancelled mid-push.
    concurrency:
      group: bench-results-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # Applying a label needs Triage access or higher, which is still short of write/admin — a triage-only
      # collaborator could apply this one, so applying it is not itself proof of maintainer trust. Ask GitHub who
      # applied it and what access they actually have on this repo. (A collaborator with the Maintain role is
      # accepted too: this API reports that role's `permission` as `write`, not `maintain`.)
      - name: Check the labeler's permission
        id: perm
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SENDER: ${{ github.event.sender.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set +e
          # stdout and stderr are kept apart: a warning gh prints to stderr on an otherwise-successful call must
          # never end up appended to $PERMISSION (that would turn a maintainer's real "write" into a string that
          # matches neither "admin" nor "write", rejecting a legitimate acceptance).
          PERMISSION=$(gh api "repos/$REPO/collaborators/$SENDER/permission" --jq .permission 2>"$RUNNER_TEMP/perm-stderr.txt")
          API_STATUS=$?
          set -e
          if [ "$API_STATUS" -ne 0 ]; then
            echo "could not read $SENDER's permission, treating as unauthorized:" >&2
            cat "$RUNNER_TEMP/perm-stderr.txt" >&2
            PERMISSION="none"
          fi
          echo "sender=$SENDER permission=$PERMISSION"
          if [ "$PERMISSION" = "admin" ] || [ "$PERMISSION" = "write" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label bench-accepted
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body \
              "Only a maintainer with write or admin access can accept a bench result. The \`bench-accepted\` label has been removed; ask a maintainer to re-apply it if this result should be ingested."
          fi
        # `authorized` is a literal "true"/"false" this script writes itself — never attacker text — so a plain
        # single-line $GITHUB_OUTPUT write is safe here; nothing below needs a heredoc or a random delimiter.

      - uses: actions/checkout@v4
        if: steps.perm.outputs.authorized == 'true'
        with:
          ref: main
        # No `pnpm install`: ingesting a result only needs `node` plus the already-checked-out scripts.

      - uses: actions/setup-node@v4
        if: steps.perm.outputs.authorized == 'true'
        with:
          node-version: 22

      # Validates the issue body against the schema and, on success, writes the result file — but into a scratch
      # directory under $RUNNER_TEMP, not the checkout, so a validation run never touches tracked files. stdout
      # (the stored path) and stderr (validation errors, which can quote attacker-supplied key names) are captured
      # to files instead of $GITHUB_OUTPUT: a fixed heredoc delimiter there previously let a crafted error message
      # inject extra `key=value` lines (including a forged `status=0`) into the step's outputs.
      - name: Validate the submitted result
        id: ingest
        if: steps.perm.outputs.authorized == 'true'
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          mkdir -p "$RUNNER_TEMP/ingest-scratch"
          cd "$RUNNER_TEMP/ingest-scratch"
          node "$GITHUB_WORKSPACE/scripts/bench-ingest.mjs" \
            >"$RUNNER_TEMP/ingest-stdout.txt" 2>"$RUNNER_TEMP/ingest-stderr.txt"
        # `continue-on-error: true` means `steps.ingest.outcome` still reports 'failure' for a routine rejected
        # submission (so later steps can branch on it), while the job itself doesn't go red for something that
        # just means "this issue's JSON didn't validate".

      # Copies the already-validated file into the real checkout and commits it. Retries on a losing race against
      # another accepted result being pushed concurrently (different issue, same target branch): re-fetch, hard
      # reset to the new tip, and try again, up to 3 attempts, recorded to `$RUNNER_TEMP/commit-result.txt` as
      # exactly one of:
      #   - `pushed`          a new commit landed on main.
      #   - `already-recorded` this id is already on main with byte-identical content (the same issue accepted
      #     twice, or a duplicate webhook delivery) — nothing to commit, reported as success without a second
      #     commit or push.
      #   - `id-collision`    this id is already on main with *different* content. The id is
      #     `day-hash8(gpu|ua|backend)` (`scripts/bench-id.mjs`), so the same device re-running the bench on the
      #     same day reproduces it. `bench-ingest.mjs`'s `wx` write only protects one invocation against
      #     overwriting a file already in ITS OWN output directory; it never sees `bench/devices` on `main` here
      #     (validation runs in an empty scratch dir precisely so a bad submission can't touch the checkout), so
      #     this step has to make that "never silently overwrite" guarantee itself before copying over main's
      #     copy — checked fresh on every retry, since main can move between attempts.
      #   - `failed`          every push attempt was rejected; the loop ran out of retries with nothing landed.
      # The step exits non-zero for `failed` and `id-collision` (nothing recorded) and zero for `pushed` and
      # `already-recorded` (the intended state is on main either way), so `steps.commit.outcome` alone tells the
      # later steps whether to deploy Pages and how to report back.
      - name: Store the result and update the table
        id: commit
        if: steps.perm.outputs.authorized == 'true' && steps.ingest.outcome == 'success'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -e
          REL_PATH=$(cat "$RUNNER_TEMP/ingest-stdout.txt")
          FILE_NAME=$(basename "$REL_PATH")
          if [[ ! "$FILE_NAME" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9]{8}\.json$ ]]; then
            echo "unexpected result file name from ingest: $FILE_NAME" >&2
            exit 1
          fi
          echo "$FILE_NAME" > "$RUNNER_TEMP/result-file-name.txt"
          SRC="$RUNNER_TEMP/ingest-scratch/bench/devices/$FILE_NAME"

          git config user.name "threeforge-bench[bot]"
          git config user.email "threeforge-bench[bot]@users.noreply.github.com"

          ATTEMPTS=3
          ATTEMPT=1
          RESULT="failed"
          while [ "$ATTEMPT" -le "$ATTEMPTS" ]; do
            git fetch origin main
            git reset --hard origin/main

            if git cat-file -e "origin/main:bench/devices/$FILE_NAME" 2>/dev/null; then
              if git show "origin/main:bench/devices/$FILE_NAME" | cmp -s - "$SRC"; then
                echo "$FILE_NAME is already recorded on main with identical content"
                RESULT="already-recorded"
              else
                echo "$FILE_NAME already exists on main with different content (id collision)" >&2
                RESULT="id-collision"
              fi
              break
            fi

            mkdir -p bench/devices
            cp -f "$SRC" "bench/devices/$FILE_NAME"
            node scripts/bench-devices.mjs
            git add bench/devices docs/devices.md
            if git diff --cached --quiet; then
              echo "nothing to commit; $FILE_NAME is already recorded on main"
              RESULT="already-recorded"
              break
            fi
            git commit -m "bench: device result from #${ISSUE_NUMBER}"
            if git push origin HEAD:main; then
              RESULT="pushed"
              break
            fi
            echo "push rejected, retrying ($ATTEMPT/$ATTEMPTS)"
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "$RESULT" > "$RUNNER_TEMP/commit-result.txt"
          if [ "$RESULT" = "failed" ] || [ "$RESULT" = "id-collision" ]; then
            exit 1
          fi

      # A GITHUB_TOKEN push never fires `on: push` in another workflow, so `pages.yml` (which deploys the public
      # devices table) would otherwise never run for this change; ask for it explicitly. Its own step (rather than
      # folded into the commit step above) so that a dispatch failure is never reported as "could not be
      # committed" when the commit itself actually succeeded. Skipped for `already-recorded`: nothing changed, so
      # the already-deployed table is still current.
      - name: Deploy the public table
        if: steps.commit.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          RESULT=$(cat "$RUNNER_TEMP/commit-result.txt" 2>/dev/null || echo "")
          if [ "$RESULT" = "pushed" ]; then
            gh workflow run pages.yml --ref main --repo "$REPO"
          fi

      # Always reports back, success or failure, so a contributor (or maintainer) never has to go read Actions
      # logs to find out what happened. Every value interpolated into a `gh` command below is a shell variable
      # sourced from a file or an `env:`-passed built-in step field, never a raw `${{ }}` template expansion of
      # attacker-controlled text, and the comment body is always built with `printf '%s'`. Any message that can
      # contain attacker text (the ingest script's stderr, which can echo back a submitted object's key names) is
      # wrapped in a fence computed to be one backtick longer than the longest run of backticks already inside
      # it, so the message can never break out of its own code block to inject live Markdown or an @-mention.
      - name: Report the outcome
        if: always() && steps.perm.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          INGEST_OUTCOME: ${{ steps.ingest.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
        run: |
          set -e

          fence_for() {
            local msg=$1 max=2 len run
            while IFS= read -r run; do
              len=${#run}
              if [ "$len" -gt "$max" ]; then max=$len; fi
            done < <(grep -oE '`+' <<<"$msg" || true)
            printf '%*s' "$((max + 1))" '' | tr ' ' '`'
          }

          # `ingest` is 'skipped' (not 'failure') when a required prior step (checkout, setup-node) never ran it
          # at all — an infrastructure problem, not anything wrong with the submitted JSON. Say so distinctly
          # instead of blaming the contributor's data.
          if [ "$INGEST_OUTCOME" = "skipped" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body \
              "The workflow could not prepare the checkout before validating this result (an infrastructure problem, not the submission). Re-apply \`bench-accepted\` to retry."
            exit 0
          fi

          if [ "$INGEST_OUTCOME" != "success" ]; then
            MESSAGE=$(cat "$RUNNER_TEMP/ingest-stderr.txt" 2>/dev/null || echo "no error output captured")
            FENCE=$(fence_for "$MESSAGE")
            BODY=$(printf 'The result could not be recorded:\n\n%s\n%s\n%s\nEdit the issue to fix the JSON block; a maintainer can re-apply `bench-accepted` once it looks right.' "$FENCE" "$MESSAGE" "$FENCE")
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$BODY"
            exit 0
          fi

          if [ "$COMMIT_OUTCOME" != "success" ]; then
            RESULT=$(cat "$RUNNER_TEMP/commit-result.txt" 2>/dev/null || echo "")
            # Remove the label so a maintainer's re-apply fires a fresh `labeled` event instead of silently
            # sitting there "accepted" while nothing was actually recorded.
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label bench-accepted || true
            if [ "$RESULT" = "id-collision" ]; then
              FILE_NAME=$(cat "$RUNNER_TEMP/result-file-name.txt" 2>/dev/null || echo "this id")
              BODY=$(printf 'A different result already exists on `main` as `%s` (same GPU, browser and backend, submitted the same day) — this submission was not recorded, to avoid overwriting it. The `bench-accepted` label has been removed; a maintainer can re-apply it after confirming which result should win, or ask for a resubmission on a later day.' "$FILE_NAME")
            else
              BODY="Validation passed but the result could not be committed to \`main\` (the push kept failing). The \`bench-accepted\` label has been removed; a maintainer can re-apply it to retry."
            fi
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$BODY"
            exit 0
          fi

          FILE_NAME=$(cat "$RUNNER_TEMP/result-file-name.txt" 2>/dev/null || echo "the result")
          BODY=$(printf 'Recorded as `%s` and added to docs/devices.md. Thank you.' "$FILE_NAME")
          gh issue close "$ISSUE_NUMBER" --repo "$REPO" --comment "$BODY"
