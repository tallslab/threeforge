name: ci
# Pull requests and pushes to main, plus the release tags the `publish` job reacts to. `branches:` alone filters
# tag pushes out entirely, so `tags:` has to be spelled here or `publish` can never fire.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Read-only for every job; `publish` re-declares the one extra permission npm provenance needs.
permissions:
  contents: read

# One run per ref. A superseded pull-request run is cancelled; a push to main or a tag is not, so a release never
# loses its own run to the next commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CONTRIBUTING.md rule 4 as a check: every commit in the pushed range that touches a rendering path carries a
  # `Budget:` line. Runs on pushes as well as pull requests: gating it on pull_request alone would leave a direct
  # push to main unchecked.
  commit-rules:
    name: Budget line on every rendering commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base..head range has to resolve; the default shallow merge-ref checkout has neither end
      # A push's range is `pushRange` in scripts/commit-rules.mjs, unit-tested there rather than written in shell:
      # before..after when the push fast-forwarded, else the merge-base with main (the push created the ref, or
      # force-pushed over commits that are no longer an ancestor — and may no longer be in the clone). Only a missing
      # merge-base, or one that is the pushed commit itself (the seeding push of main), leaves no range to judge; the
      # reason is printed either way, and says which of the three cases it was.
      - name: Check the commits this push or pull request adds
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT" = "pull_request" ]; then
            exec node scripts/commit-rules.mjs "$PR_BASE..$PR_HEAD"
          fi
          exec node scripts/commit-rules.mjs --push "$PUSH_BEFORE" "$PUSH_AFTER"

  unit:
    name: Typecheck, units, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # The unit suite carries no wall-clock measurement. The ledger's per-submission scaling (µs per submission at
      # 20k over 2k, once a `< 3x` gate in `test/unit/ledger-hot-path.test.ts`) is printed by
      # `scripts/ledger-overhead.mjs` in the summary step below, as a figure and not a gate. What that file guards
      # instead is the constant-cost mechanism, by counts no runner noise can move: `describes === 0` and `reads <= 4`
      # per frame (so `registry.describe()` cannot return to the hot path), one scene walk per frame, and the
      # source-text scan of `src/ledger/` for iterator-protocol walks of the records.
      - run: pnpm test
      - run: pnpm build
      # Nothing else in CI watches the ledger's own cost, and a 50 % allocation regression has once landed unnoticed
      # and taken a bisect to attribute.
      # This prints `scripts/ledger-overhead.mjs` into the run summary so the numbers are at least visible per run.
      # It is INFORMATIONAL and UNVALIDATED until it has run once on a real runner: the figures are
      # machine-specific, a shared runner is noisy, and nothing here compares them to anything. `continue-on-error`
      # so it can never fail the job, and it runs after `pnpm build` because the script reads `dist/`.
      - name: Ledger overhead (informational, not a gate)
        continue-on-error: true
        run: |
          {
            echo '### Ledger overhead'
            echo ''
            echo 'Informational only: not a gate, nothing compares these to a baseline, and they are unvalidated'
            echo 'until this step has run once on a real runner. Machine-specific; compare runs on one machine.'
            echo ''
            echo '```'
            node scripts/ledger-overhead.mjs
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The e2e suite minus everything that needs downloaded content. This job deliberately fetches NOTHING: no Kenney
  # kits, no glTF corpus. See the coverage note below.
  e2e:
    name: e2e ${{ matrix.backend }}
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: webgl2
          # A SwiftShader runner that reports no WebGPU adapter makes the fixture skip every webgpu test, and the job
          # goes green having rendered nothing. FORGE_REQUIRE_WEBGPU=1 turns that skip into a failure.
          - backend: webgpu
            requireWebgpu: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `chromium` for the full build, `chromium-headless-shell` for the WebGPU/SwiftShader path the Linux default
      # (FORGE_WEBGPU unset ⇒ swiftshader) takes.
      - run: pnpm exec playwright install --with-deps chromium chromium-headless-shell
      - run: pnpm build # cli.spec.ts and mcp.spec.ts drive the built CLI in dist/
      # COVERAGE, stated so a green run is not read as more than it is. Measured at 0.9.0 with
      # `pnpm exec playwright test --list
      # [--grep-invert "@corpus|@bench"]`: the suite is 260 tests in 36 files PER PROJECT (520 across the two); this
      # selection runs 96 per project (192 across both) in 28 files.
      # Dropped here and covered only by the weekly full-corpus `assets.yml`: 148 @corpus tests per project and the
      # 16 @bench ones. Concretely, a green run here does NOT cover
      #   - 15 of cli.spec.ts's 20 tests and 10 of mcp.spec.ts's 13 (the CLI/MCP agent surface on real models),
      #   - ParticleBudget at all (particles.spec.ts contributes zero tests here; it opens `bossfight`, which reaches
      #     the Kenney kits through buildArena), and only the naive half of shadow-budget.spec.ts,
      #   - arena, assets, bench, biome, crowd, vat and warmup, which contribute zero tests here,
      #   - ANY WebGPU pixel: on the webgpu leg the adapter is SwiftShader, so test/e2e/fixtures.ts turns pixelChecks
      #     off; 23 test.skip(!forge.pixelChecks) declarations skip whole tests and the rest skip their screenshots.
      #     WebGPU pixel parity is proven only by a local run on a native adapter (docs/release.md, step 2).
      # `--forbid-only` so a stray test.only cannot quietly shrink this selection further.
      - name: e2e without downloaded content
        run: pnpm exec playwright test --project=${{ matrix.backend }} --grep-invert "@corpus|@bench" --forbid-only
        env:
          FORGE_REQUIRE_WEBGPU: ${{ matrix.requireWebgpu }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-${{ matrix.backend }}-artifacts
          path: test-results
          retention-days: 7

  # The benchmark gate (CONTRIBUTING.md rule 8). Separate from `e2e` because it is the only PR job that downloads
  # anything: the bench scenes reach the Kenney kits through bossfight/crowd and the water map through lake.
  # Only deterministic cost metrics are gated here; timing is recorded, since FORGE_GPU is not `native`.
  bench:
    name: bench gate ${{ matrix.backend }}
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [webgl2, webgpu]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium chromium-headless-shell
      - uses: actions/cache@v4
        with:
          path: test/assets/files
          key: kits-${{ hashFiles('scripts/fetch-kits.mjs', 'scripts/fetch-safe.mjs') }}
      # Kits and single files only; the Poly Haven corpus is `assets.yml`'s business. FORGE_FETCH_STRICT=1 so a failed
      # download fails this step by name, instead of surfacing in bench.spec.ts as `kenney-mini-characters kit not
      # found` — a network failure that reads as a threeforge defect.
      - run: pnpm assets:kits
        env:
          FORGE_KITS_ONLY: '1'
          FORGE_FETCH_STRICT: '1'
      - run: node scripts/bench-run.mjs ${{ matrix.backend }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results-${{ matrix.backend }}
          path: bench/results
          retention-days: 14
          if-no-files-found: ignore

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [unit, e2e, bench]
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # npm publishes whatever package.json says, not what the tag says; a tag that disagrees would ship a version
      # nobody asked for under a git tag that points somewhere else. (`src/version.ts` is held equal to package.json
      # by a unit test, which `needs: unit` has already run.)
      - name: The tag must match package.json
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          VERSION=$(node -p "require('./package.json').version")
          if [ "$REF_NAME" != "v$VERSION" ]; then
            echo "tag $REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi
          echo "tag $REF_NAME matches package.json $VERSION"
      - run: pnpm build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
