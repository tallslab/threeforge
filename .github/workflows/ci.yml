name: ci
# Pull requests and pushes to main, plus the release tags the `publish` job reacts to. `branches:` alone filters
# tag pushes out entirely, so `tags:` has to be spelled here or `publish` can never fire.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Read-only for every job; `publish` re-declares the one extra permission npm provenance needs.
permissions:
  contents: read

# One run per ref. A superseded pull-request run is cancelled; a push to main or a tag is not, so a release never
# loses its own run to the next commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CONTRIBUTING.md rule 4 as a check: every commit in the pushed range that touches a rendering path carries a
  # `Budget:` line. Runs on pushes as well as pull requests: gating it on pull_request alone would leave a direct
  # push to main unchecked.
  commit-rules:
    name: Budget line on every rendering commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the base..head range has to resolve; the default shallow merge-ref checkout has neither end
      # A push's range is `pushRange` in scripts/commit-rules.mjs, unit-tested there rather than written in shell:
      # before..after when the push fast-forwarded, else the merge-base with main (the push created the ref, or
      # force-pushed over commits that are no longer an ancestor — and may no longer be in the clone). Only a missing
      # merge-base, or one that is the pushed commit itself (the seeding push of main), leaves no range to judge; the
      # reason is printed either way, and says which of the three cases it was.
      - name: Check the commits this push or pull request adds
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT" = "pull_request" ]; then
            exec node scripts/commit-rules.mjs "$PR_BASE..$PR_HEAD"
          fi
          exec node scripts/commit-rules.mjs --push "$PUSH_BEFORE" "$PUSH_AFTER"

  unit:
    name: Typecheck, units, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # The unit suite carries no wall-clock measurement. The ledger's per-submission scaling (µs per submission at
      # 20k over 2k, once a `< 3x` gate in `test/unit/ledger-hot-path.test.ts`) is printed by
      # `scripts/ledger-overhead.mjs` in the summary step below, as a figure and not a gate. What that file guards
      # instead is the constant-cost mechanism, by counts no runner noise can move: `describes === 0` and `reads <= 4`
      # per frame (so `registry.describe()` cannot return to the hot path), one scene walk per frame, and the
      # source-text scan of `src/ledger/` for iterator-protocol walks of the records.
      - run: pnpm test
      - run: pnpm build
      # Nothing else in CI watches the ledger's own cost, and a 50 % allocation regression has once landed unnoticed
      # and taken a bisect to attribute.
      # This prints `scripts/ledger-overhead.mjs` into the run summary so the numbers are at least visible per run.
      # It is INFORMATIONAL and UNVALIDATED until it has run once on a real runner: the figures are
      # machine-specific, a shared runner is noisy, and nothing here compares them to anything. `continue-on-error`
      # so it can never fail the job, and it runs after `pnpm build` because the script reads `dist/`.
      - name: Ledger overhead (informational, not a gate)
        continue-on-error: true
        run: |
          {
            echo '### Ledger overhead'
            echo ''
            echo 'Informational only: not a gate, nothing compares these to a baseline, and they are unvalidated'
            echo 'until this step has run once on a real runner. Machine-specific; compare runs on one machine.'
            echo ''
            echo '```'
            node scripts/ledger-overhead.mjs
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The e2e suite minus everything that needs downloaded content. This job deliberately fetches NOTHING: no Kenney
  # kits, no glTF corpus. See the coverage note below.
  e2e:
    name: e2e ${{ matrix.backend }}
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # requireKtx: this leg installs KTX-Software below and may not skip the test that encodes KTX2.
          - backend: webgl2
            requireKtx: '1'
          # A SwiftShader runner that reports no WebGPU adapter makes the fixture skip every webgpu test, and the job
          # goes green having rendered nothing. FORGE_REQUIRE_WEBGPU=1 turns that skip into a failure.
          # The leg is advisory: Dawn's SwiftShader adapter on these runners drops the device between test steps
          # (docs/design.md), so WebGPU is proven by a local run on a native adapter before a release
          # (docs/release.md) and this leg warns instead of failing the check.
          - backend: webgpu
            requireWebgpu: '1'
            advisory: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `chromium` for the full build, `chromium-headless-shell` for the WebGPU/SwiftShader path the Linux default
      # (FORGE_WEBGPU unset ⇒ swiftshader) takes.
      - run: pnpm exec playwright install --with-deps chromium chromium-headless-shell
      - run: pnpm build # cli.spec.ts and mcp.spec.ts drive the built CLI in dist/
      # `threeforge optimize --textures ktx2` shells out to KTX-Software's `ktx`. The test that encodes a model, loads it
      # and measures its GPU bytes (test/e2e/ktx2.spec.ts) skips without the encoder, which would let a regression through
      # unseen, so the gating leg installs one release, checked against its published SHA-256 before it is installed,
      # and FORGE_REQUIRE_KTX=1 turns a missing encoder into a failure. The webgpu leg skips that test anyway (no pixel
      # checks on SwiftShader), and encoding on a native WebGPU adapter is proven locally (docs/release.md, step 2).
      - name: KTX-Software 4.4.2, pinned and checksum-verified
        if: matrix.requireKtx == '1'
        run: |
          set -eu
          deb="$RUNNER_TEMP/ktx-software.deb"
          curl -fsSL -o "$deb" "https://github.com/KhronosGroup/KTX-Software/releases/download/v${KTX_VERSION}/KTX-Software-${KTX_VERSION}-Linux-x86_64.deb"
          echo "${KTX_SHA256}  $deb" | sha256sum --check --strict
          sudo apt-get install -y "$deb"
          ktx --version
        env:
          KTX_VERSION: 4.4.2
          KTX_SHA256: ca635ed489d8bf54fac8d7687056c651193de0740830a7738cc034adc63e3027
      # COVERAGE, stated so a green run is not read as more than it is. Measured with
      # `pnpm exec playwright test --list --project=webgl2
      # [--grep-invert "@corpus|@bench|@temporal"]`: the suite is 300 tests in 43 files PER PROJECT (600 across the
      # two); this selection runs 128 per project (256 across both) in 31 files.
      # Dropped here: 152 @corpus tests per project, covered only by the weekly full-corpus `assets.yml` (two of them
      # are temporal and also run in the `temporal` job below), the 16 @bench ones (the `bench` job) and the 4 other
      # @temporal ones (the `temporal` job). Concretely, a green run here does NOT cover
      #   - 15 of cli.spec.ts's 22 tests and 10 of mcp.spec.ts's 14 (the CLI/MCP agent surface on real models),
      #   - ParticleBudget at all (particles.spec.ts contributes zero tests here; it opens `bossfight`, which reaches
      #     the Kenney kits through buildArena), and only the naive half of shadow-budget.spec.ts,
      #   - arena, assets, bench, biome, crowd, vat and warmup, which contribute zero tests here,
      #   - ANY WebGPU pixel: on the webgpu leg the adapter is SwiftShader, so test/e2e/fixtures.ts turns pixelChecks
      #     off; 36 test.skip(!forge.pixelChecks) declarations skip whole tests and the rest skip their screenshots.
      #     WebGPU pixel parity is proven only by a local run on a native adapter (docs/release.md, step 2).
      # `--forbid-only` so a stray test.only cannot quietly shrink this selection further.
      # The advisory leg goes through scripts/advisory-report.mjs, which runs the tests and judges their report after
      # every run: failed tests become a warning with real counts, while the @adapter check (smoke.spec.ts) not
      # passing, an error of the run itself, an abnormal exit and a missing report still fail the job.
      - name: e2e without downloaded content
        run: |
          tests=(pnpm exec playwright test --project=${{ matrix.backend }} --grep-invert "@corpus|@bench|@temporal" --forbid-only --reporter=list,json)
          if [ "${{ matrix.advisory }}" = "true" ]; then
            node scripts/advisory-report.mjs "$PLAYWRIGHT_JSON_OUTPUT_NAME" "e2e ${{ matrix.backend }} on the SwiftShader adapter" adapter -- "${tests[@]}"
          else
            "${tests[@]}"
          fi
        env:
          FORGE_REQUIRE_WEBGPU: ${{ matrix.requireWebgpu }}
          FORGE_REQUIRE_KTX: ${{ matrix.requireKtx }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/e2e-report/run.json
      # always(), not failure(): the advisory leg turns a failed run into a warning, so its step succeeds and a
      # failure() upload would never see what it left behind. A green run leaves nothing to upload.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-${{ matrix.backend }}-artifacts
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-${{ matrix.backend }}-report
          path: ${{ runner.temp }}/e2e-report
          retention-days: 7
          if-no-files-found: ignore

  # The temporal specs (test/e2e/temporal-*.spec.ts, tagged @temporal) have a job of their own: two of the six are
  # also @corpus (the animation twin is a Kenney mini character) and the `e2e` job downloads nothing.
  # webgl2 gates. The webgpu leg runs on these runners' SwiftShader adapter, where a screenshot drops the device, so
  # every temporal test skips there and the report below says so in words: that leg checks NO WebGPU pixel. Native
  # WebGPU is proven only by a local run (docs/release.md, step 2).
  # A failing sequence writes its first and its worst failing frame, their neighbours and sequence.json (every step
  # in order, camera, buffer sizes, adapter, the command to run it again) under FORGE_TEMPORAL_OUT. That directory and
  # the ran/skipped/excluded report are uploaded whatever the outcome. `runner.temp` exists only at step level.
  temporal:
    name: temporal ${{ matrix.backend }}
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [webgl2, webgpu]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium chromium-headless-shell
      - uses: actions/cache@v5
        with:
          path: test/assets/files
          key: kits-${{ hashFiles('scripts/fetch-kits.mjs', 'scripts/fetch-safe.mjs') }}
      - run: pnpm assets:kits
        env:
          FORGE_KITS_ONLY: '1'
          FORGE_FETCH_STRICT: '1'
      - name: temporal specs
        run: |
          mkdir -p "$FORGE_TEMPORAL_OUT"
          pnpm exec playwright test --project=${{ matrix.backend }} --grep "@temporal" --forbid-only --reporter=list,json
        env:
          FORGE_TEMPORAL_OUT: ${{ runner.temp }}/threeforge-temporal
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/threeforge-temporal/run.json
      - name: which temporal tests ran, skipped or were excluded
        if: always()
        run: |
          pnpm exec playwright test --list --reporter=json --project=${{ matrix.backend }} test/e2e/temporal- > "$OUT/list.json"
          node scripts/temporal-report.mjs "$OUT/list.json" "$OUT/run.json" "$OUT/report.md"
        env:
          OUT: ${{ runner.temp }}/threeforge-temporal
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: temporal-${{ matrix.backend }}
          path: ${{ runner.temp }}/threeforge-temporal
          retention-days: 14
          if-no-files-found: ignore

  # The benchmark gate (CONTRIBUTING.md rule 8). Separate from `e2e` because it is the only PR job that downloads
  # anything: the bench scenes reach the Kenney kits through bossfight/crowd and the water map through lake.
  # Only deterministic cost metrics are gated here; timing is recorded, since FORGE_GPU is not `native`.
  bench:
    name: bench gate ${{ matrix.backend }}
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: webgl2
          # Advisory for the same reason as the e2e leg: the SwiftShader adapter loses the device mid-run. On the
          # first runs every one of the 16 scenes failed there at the overdraw readback, so this leg has measured
          # nothing yet; its report says how many scenes it measured instead of calling that a regression.
          - backend: webgpu
            advisory: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium chromium-headless-shell
      - uses: actions/cache@v5
        with:
          path: test/assets/files
          key: kits-${{ hashFiles('scripts/fetch-kits.mjs', 'scripts/fetch-safe.mjs') }}
      # Kits and single files only; the Poly Haven corpus is `assets.yml`'s business. FORGE_FETCH_STRICT=1 so a failed
      # download fails this step by name, instead of surfacing in bench.spec.ts as `kenney-mini-characters kit not
      # found` — a network failure that reads as a threeforge defect.
      - run: pnpm assets:kits
        env:
          FORGE_KITS_ONLY: '1'
          FORGE_FETCH_STRICT: '1'
      # The advisory leg runs the scenes through scripts/advisory-report.mjs together with the @adapter check, which
      # the bench selection does not contain: no adapter, an error of the run, an abnormal exit or a missing report
      # fail the job, failed scenes do not. The gate then compares whatever was measured; with --advisory it turns
      # the two outcomes it decides (worse than the baseline, no scene measured) into warnings itself. The shell reads
      # no exit code: a gate that crashes on results it cannot parse exits 1 just as a regression does.
      - name: bench gate
        run: |
          if [ "${{ matrix.advisory }}" = "true" ]; then
            rm -f bench/results/local.${{ matrix.backend }}.json
            scenes=(pnpm exec playwright test test/e2e/bench.spec.ts test/e2e/smoke.spec.ts --project=${{ matrix.backend }} --reporter=list,json)
            node scripts/advisory-report.mjs "$PLAYWRIGHT_JSON_OUTPUT_NAME" "bench ${{ matrix.backend }} on the SwiftShader adapter" adapter -- "${scenes[@]}"
            node scripts/bench-gate.mjs ${{ matrix.backend }} --advisory
          else
            node scripts/bench-run.mjs ${{ matrix.backend }}
          fi
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/bench-report/run.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bench-results-${{ matrix.backend }}
          path: bench/results
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bench-${{ matrix.backend }}-report
          path: ${{ runner.temp }}/bench-report
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bench-${{ matrix.backend }}-artifacts
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [unit, e2e, temporal, bench]
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # npm publishes whatever package.json says, not what the tag says; a tag that disagrees would ship a version
      # nobody asked for under a git tag that points somewhere else. (`src/version.ts` is held equal to package.json
      # by a unit test, which `needs: unit` has already run.)
      - name: The tag must match package.json
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          VERSION=$(node -p "require('./package.json').version")
          if [ "$REF_NAME" != "v$VERSION" ]; then
            echo "tag $REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi
          echo "tag $REF_NAME matches package.json $VERSION"
      - run: pnpm build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
