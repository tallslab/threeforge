name: pages
# Deploys the device bench page (bench-app) to GitHub Pages. One-time setting: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. `pages: write` and `id-token: write` are what mint a deployment, so they live on the
# deploy job alone — the build job runs `pnpm install` and a Vite build over third-party dependency code and has
# no business holding a token that can publish to the site.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: test/assets/files
          key: kits-${{ hashFiles('scripts/fetch-kits.mjs', 'scripts/fetch-safe.mjs') }}
      # The page needs the eight mini characters and the water map. FORGE_BENCH_APP_OPTIONAL is NOT set here: a
      # missing kit must fail this build rather than publish a bench page whose crowd scene is empty.
      - run: FORGE_KITS_ONLY=1 pnpm assets:kits
      # Regenerate bench/devices/index.json (and docs/devices.md) from bench/devices/*.json before the build:
      # `bench-app-assets.mjs` copies that index into the page as devices.json, so without this step a result that
      # `bench-results` committed would be on main but missing from the published table. Not committed here.
      - run: pnpm bench:devices
      - run: pnpm build:bench-app
        env:
          VITE_FORGE_REPO: ${{ github.repository }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/bench-app
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # `actions/configure-pages` used to sit in the build job. It is gone rather than moved: its outputs were
      # never read, and it needs the Pages API permission this file now keeps out of the build job. A repository
      # whose Pages source is not "GitHub Actions" fails here instead, with a message that says so.
      - id: deployment
        uses: actions/deploy-pages@v4
