name: assets
# The weekly full-corpus run: everything `ci.yml` drops. `ci.yml`'s e2e job deliberately downloads nothing and so
# excludes the 148 @corpus tests per project (296 across both backends, measured at bf4c547) — the CLI and MCP agent surface on real
# models, ParticleBudget and the boss-fight half of ShadowBudget, the arena/biome/crowd/vat/warmup scenes, and
# `assets.spec.ts` itself. They are covered here and nowhere else, so a red run here is a real regression even
# though every pull request was green.
#
# That holds for webgl2. The webgpu leg runs on these runners' SwiftShader adapter, where Dawn drops the device
# between test steps (docs/design.md), so its TEST failures are reported and do not fail the job. Everything before
# them (install, strict downloads, build) still does, and so do an error of the run itself and the `@adapter` check
# (test/e2e/smoke.spec.ts) not passing. The guarded specs skip their captures on that adapter; biome, assets and the
# CLI's own comparisons still capture there, and a pass on this runner does not establish native WebGPU pixel
# correctness. That is covered only by the local run in docs/release.md, which a release still needs.
#
# This workflow NEVER commits. `assets.spec.ts` rewrites the tracked docs/assets-report*.{json,md}; those files
# leave as a build artifact for a maintainer to inspect and commit by hand. Nothing here has write permission.
on:
  schedule:
    - cron: '17 4 * * 1' # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assets
  cancel-in-progress: false

jobs:
  corpus:
    name: corpus ${{ matrix.backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: webgl2
          # requireWebgpu: a no-adapter runner must fail, not skip its way to green. It still does under `advisory`:
          # the `@adapter` check opens a page on WebGPU and draws a frame, and scripts/advisory-report.mjs, which runs
          # the tests itself, exits 1 unless that test passed. Counting passes would not do: the CLI's help and schema
          # tests need no GPU.
          - backend: webgpu
            requireWebgpu: '1'
            advisory: true
    env:
      # Every report row is stamped with a run id, and the Markdown is republished only when one run
      # measured every asset. Unpinned, the id is derived from the UTC day, so a corpus run that crosses midnight
      # splits into two ids and declines to publish (fail-closed, but it wastes the run). One id per job removes
      # the split; the two backends write separate report files, so they carry separate ids by design.
      FORGE_RUN_ID: corpus-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.backend }}
      FORGE_REQUIRE_WEBGPU: ${{ matrix.requireWebgpu }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium chromium-headless-shell
      - uses: actions/cache@v5
        with:
          path: test/assets/files
          key: corpus-${{ hashFiles('scripts/fetch-kits.mjs', 'scripts/fetch-assets.mjs', 'test/assets/manifest.json') }}
      # The kits and the Poly Haven models: the whole corpus, unlike ci.yml's FORGE_KITS_ONLY bench fetch.
      # FORGE_FETCH_STRICT=1: both scripts record a failed download and would otherwise exit 0, so a network failure
      # has to fail here, named at its source, not steps later as a shorter corpus.
      - run: pnpm assets:kits
        env:
          FORGE_FETCH_STRICT: '1'
      - run: pnpm assets
        env:
          FORGE_FETCH_STRICT: '1'
      - run: pnpm build # cli.spec.ts and mcp.spec.ts drive the built CLI
      # Everything except @bench: the benchmark gate is ci.yml's job and would only re-measure scenes here.
      # "Fails when not every asset passes" rests on two things, not on soft assertions alone. An asset that RAN and
      # misbehaved fails through assets.spec.ts's soft assertions (the whole report is still written). An asset that
      # never downloaded is stopped by the strict fetch above, and — should an errored entry reach the spec anyway,
      # as it does in a local non-strict run — `corpusPlan` (test/e2e/assets-report.ts, unit-tested) still generates its test,
      # which fails naming the fetch error, and keeps it in the Markdown gate's `expected`. Soft assertions by
      # themselves covered only the first case: an errored entry used to produce no test at all.
      # The temporal specs run here too (this is the only place the webgpu leg must have an adapter), so their failure
      # frames get the same home as in ci.yml's `temporal` job. `runner.temp` exists only at step level.
      - name: Full corpus on ${{ matrix.backend }}
        run: |
          mkdir -p "$FORGE_TEMPORAL_OUT"
          tests=(pnpm exec playwright test --project=${{ matrix.backend }} --grep-invert "@bench" --forbid-only --reporter=list,json)
          if [ "${{ matrix.advisory }}" = "true" ]; then
            # The script runs the tests and judges their report after every run, not only a failed one: Playwright
            # exits 0 when the @adapter check is skipped.
            node scripts/advisory-report.mjs "$PLAYWRIGHT_JSON_OUTPUT_NAME" "corpus ${{ matrix.backend }} on the SwiftShader adapter" adapter -- "${tests[@]}"
          else
            "${tests[@]}"
          fi
        env:
          FORGE_TEMPORAL_OUT: ${{ runner.temp }}/threeforge-temporal
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/threeforge-temporal/run.json
      - name: which temporal tests ran, skipped or were excluded
        if: always()
        run: |
          pnpm exec playwright test --list --reporter=json --project=${{ matrix.backend }} test/e2e/temporal- > "$OUT/list.json"
          node scripts/temporal-report.mjs "$OUT/list.json" "$OUT/run.json" "$OUT/report.md"
        env:
          OUT: ${{ runner.temp }}/threeforge-temporal
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: temporal-${{ matrix.backend }}
          path: ${{ runner.temp }}/threeforge-temporal
          retention-days: 14
          if-no-files-found: ignore
      # always(): the report is most useful precisely when the run went red.
      - name: What the run did to the tracked report (never committed)
        if: always()
        run: git status --porcelain -- docs bench || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: assets-report-${{ matrix.backend }}
          path: |
            docs/assets-report.md
            docs/assets-report.json
            docs/assets-report-webgpu.md
            docs/assets-report-webgpu.json
          retention-days: 30
          if-no-files-found: warn
      # always(), not failure(): the advisory leg's failed tests leave the step green, and what they wrote is the
      # only record of them.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: corpus-${{ matrix.backend }}-artifacts
          path: test-results
          retention-days: 7
          if-no-files-found: ignore
